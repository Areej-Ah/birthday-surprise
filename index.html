<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171333">
<title>A Little Birthday Surprise</title>
<style>
  :root { --gold:#ffdba0; --pink:#ff9fd2; --lav:#c6a9ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    min-height:100vh; overflow:hidden; color:#fff8ff;
    font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(ellipse at 50% 85%, #b76eaa 0%, #554178 35%, #211b46 68%, #11132e 100%);
  }
  .scene { position:relative; min-height:100svh; display:grid; place-items:center; isolation:isolate; overflow:hidden; }
  .nebula, .stars, .fireworks, .clouds { position:absolute; inset:0; pointer-events:none; }
  .nebula {
    z-index:-3; opacity:.8;
    background:
      radial-gradient(ellipse at 15% 75%, #ee9fc74a, transparent 36%),
      radial-gradient(ellipse at 85% 65%, #9e8bff45, transparent 34%),
      radial-gradient(ellipse at 50% 20%, #f6b6db1e, transparent 38%);
    animation: breathe 8s ease-in-out infinite alternate;
  }
  .stars { z-index:-2; }
  .star { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff8df; box-shadow:0 0 8px 2px #ffe8bd99; animation:twinkle var(--dur,2.5s) ease-in-out infinite alternate; }
  .clouds { z-index:-1; top:auto; bottom:-65px; height:180px; opacity:.6; filter:blur(22px);
    background:radial-gradient(ellipse at 10% 70%,#f4a8d6 0 12%,transparent 38%),radial-gradient(ellipse at 42% 100%,#b8a2ff 0 18%,transparent 48%),radial-gradient(ellipse at 86% 80%,#d69ad8 0 14%,transparent 42%);
  }
  .moon { position:absolute; right:9%; top:8%; width:52px; height:52px; border-radius:50%; background:#ffe8bb; box-shadow:0 0 34px #ffe8bb80; opacity:.9; }
  .moon:after { content:""; position:absolute; left:16px; top:-6px; width:49px; height:49px; border-radius:50%; background:#242047; }
  .scene.gift-mode { background:radial-gradient(ellipse at 50% 85%,#d28dbd 0%,#8468a9 32%,#39305f 72%,#222043 100%); }
  .scene.gift-mode .nebula { opacity:.45; }
  .content { width:min(92vw,760px); text-align:center; padding:28px 16px 60px; z-index:2; }
  .eyebrow { color:#ffe8c4; letter-spacing:.16em; font-size:.78rem; text-transform:uppercase; margin:0 0 22px; opacity:.92; }
  .gift-button { position:relative; width:220px; height:205px; margin:0 auto 20px; display:block; border:0; background:transparent; cursor:pointer; animation:float 3s ease-in-out infinite; filter:drop-shadow(0 18px 20px #1a123e65); -webkit-tap-highlight-color:transparent; }
  .gift-button:focus-visible, .message-button:focus-visible { outline:2px solid white; outline-offset:8px; }
  .gift-box { position:absolute; left:18px; right:18px; bottom:8px; height:125px; border-radius:7px 7px 13px 13px; background:linear-gradient(120deg,#9d7ae0,#7456b7 55%,#59438f); border:1px solid #f8d7ff9c; box-shadow:inset 10px 0 18px #ffffff12,inset -12px 0 18px #2c174f30; }
  .gift-box:before { content:""; position:absolute; left:50%; transform:translateX(-50%); top:0; width:30px; height:100%; background:linear-gradient(90deg,#f6bd85,#ffe7b4,#d78b8c); }
  .gift-lid { position:absolute; left:10px; right:10px; bottom:124px; height:34px; border-radius:6px; background:linear-gradient(120deg,#c4a3f3,#a783e2 55%,#8260c2); border:1px solid #ffe0f9; z-index:2; }
  .gift-lid:before { content:""; position:absolute; left:50%; transform:translateX(-50%); top:0; width:30px; height:100%; background:linear-gradient(90deg,#f6bd85,#ffe7b4,#d78b8c); }
  .bow { position:absolute; z-index:3; left:50%; bottom:153px; width:38px; height:24px; transform:translateX(-50%); }
  .bow:before,.bow:after { content:""; position:absolute; width:33px; height:23px; border:7px solid #ffe0a8; border-radius:80% 80% 15% 80%; box-shadow:0 0 8px #ffdfad55; }
  .bow:before { right:17px; transform:rotate(22deg); }
  .bow:after { left:17px; transform:scaleX(-1) rotate(22deg); }
  .ribbon-knot { position:absolute; left:50%; bottom:151px; transform:translateX(-50%); width:20px; height:20px; border-radius:50%; background:#f9d99b; z-index:4; box-shadow:0 0 7px #ffe7b7; }
  .gift-star { position:absolute; color:#ffe8b2; font-size:20px; animation:twinkle 1.8s infinite alternate; }
  .gift-star.s1 { top:13px; left:6px; } .gift-star.s2 { top:45px; right:1px; animation-delay:.6s; } .gift-star.s3 { bottom:24px; left:0; animation-delay:1s; }
  .gift-button:hover { filter:drop-shadow(0 18px 24px #1a123e80) brightness(1.06); }
  .gift-button:active { transform:scale(.97); }
  .tap-text { color:#fff0d7; font-size:1.2rem; font-style:italic; text-shadow:0 0 12px #ffdba088; }
  .tiny-hint { color:#f8dff5c9; font: .78rem/1.6 system-ui,sans-serif; margin-top:9px; }
  .birthday { display:none; animation:reveal 1.2s both; }
  .birthday h1 { margin:0; font-size:clamp(3.3rem,10vw,6.8rem); line-height:1.03; font-weight:normal; font-style:italic; letter-spacing:-.045em; color:#ffe1a8; text-shadow:0 0 8px #fff2d9,0 0 25px #ffb5d6b8,0 0 55px #bca3ff9e; }
  .heart { color:#ffd7e9; font-size:2rem; margin:13px 0 22px; animation:heartbeat 1.5s ease-in-out infinite; }
  .message-button { cursor:pointer; border:1px solid #ffe2b9; border-radius:999px; padding:15px 27px; color:#fff1dc; background:#ffffff0d; box-shadow:0 0 18px #ffd8a833,inset 0 0 18px #fff3ff0a; font: .98rem Georgia,serif; letter-spacing:.06em; transition:transform .2s,background .2s,box-shadow .2s; }
  .message-button:hover { transform:translateY(-2px); background:#ffffff16; box-shadow:0 0 28px #ffd8a855; }
  .message-card { max-width:560px; margin:28px auto 0; padding:26px 24px 22px; border:1px solid #ffe4c3; border-radius:20px; background:linear-gradient(135deg,#fff1dfed,#f7d7f2e8); color:#44305f; box-shadow:0 12px 45px #0d0a2e55,0 0 25px #ffdfb633; transform-origin:top; animation:reveal .65s both; }
  .message-card[hidden] { display:none; }
  .cat { font-size:1.7rem; margin-bottom:10px; }
  .message-card p { margin:0; font-size:clamp(1.25rem,3.8vw,1.8rem); line-height:1.5; font-style:italic; }
  .paw { margin-top:12px; color:#a47dbd; font-size:1.2rem; }
  canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  .hidden { display:none !important; }
  @keyframes twinkle { from {opacity:.28; transform:scale(.65)} to {opacity:1; transform:scale(1.35)} }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-8px) rotate(1deg)} }
  @keyframes breathe { from{transform:scale(1);opacity:.6} to{transform:scale(1.08);opacity:1} }
  @keyframes reveal { from{opacity:0; transform:translateY(15px) scale(.97)} to{opacity:1; transform:translateY(0) scale(1)} }
  @keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
  @media (max-height:650px) { .content{padding-top:12px;padding-bottom:22px}.gift-button{transform:scale(.82);margin-top:-10px;margin-bottom:-4px}.birthday h1{font-size:clamp(2.7rem,8vw,4.8rem)}.message-card{margin-top:16px;padding:16px} }
  @media (prefers-reduced-motion: reduce) { *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important} }
</style>
</head>
<body>
<main class="scene gift-mode" id="scene">
  <div class="nebula"></div><div class="stars" id="stars"></div><div class="clouds"></div><div class="moon"></div>
  <canvas class="fireworks" id="fireworks"></canvas>
  <section class="content" id="giftScreen">
    <p class="eyebrow">A little magic, just for you</p>
    <button class="gift-button" id="openGift" aria-label="Open the birthday gift">
      <span class="gift-star s1">✦</span><span class="gift-star s2">✧</span><span class="gift-star s3">✦</span>
      <span class="gift-box"></span><span class="gift-lid"></span><span class="bow"></span><span class="ribbon-knot"></span>
    </button>
    <div class="tap-text">Tap the gift...</div>
    <div class="tiny-hint">Psst… there's a surprise inside ✨</div>
  </section>
  <section class="content birthday" id="birthdayScreen" aria-live="polite">
    <p class="eyebrow">Tonight is all about you</p>
    <h1>Happy<br class="mobile-break"> Birthday!</h1>
    <div class="heart">♡</div>
    <button class="message-button" id="showMessage">✧ &nbsp; A Message For You &nbsp; ✧</button>
    <article class="message-card" id="messageCard" hidden>
      <div class="cat">🐈‍⬛</div>
      <p>Happy birthday cat woman,<br>I wish you return to humanity.</p>
      <div class="paw">✦ &nbsp; ☾ &nbsp; ✦</div>
    </article>
  </section>
</main>
<script>
(() => {
  const scene = document.getElementById('scene');
  const stars = document.getElementById('stars');
  const giftScreen = document.getElementById('giftScreen');
  const birthdayScreen = document.getElementById('birthdayScreen');
  const openGift = document.getElementById('openGift');
  const showMessage = document.getElementById('showMessage');
  const messageCard = document.getElementById('messageCard');
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  let opened = false, particles = [], raf;

  // Randomly scattered twinkling stars, generated locally (no external assets).
  for (let i = 0; i < 125; i++) {
    const star = document.createElement('span');
    star.className = 'star';
    star.style.left = (Math.random() * 100) + '%';
    star.style.top = (Math.random() * 100) + '%';
    star.style.setProperty('--dur', (1.5 + Math.random() * 3.5) + 's');
    star.style.animationDelay = (Math.random() * 4) + 's';
    star.style.opacity = .3 + Math.random() * .7;
    const size = 1 + Math.random() * 2.4;
    star.style.width = size + 'px'; star.style.height = size + 'px';
    stars.appendChild(star);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  const colors = ['#ff9fce', '#ffd68f', '#a8c7ff', '#d6a8ff', '#fff2c8', '#ff8e9e'];
  function burst(x, y, count = 75) {
    const color = colors[Math.floor(Math.random() * colors.length)];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 4.3;
      particles.push({x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
        life:55 + Math.random()*35, max:90, size:1 + Math.random()*2.1, color,
        sparkle:Math.random() > .65});
    }
  }
  function animate() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += .018; p.vx *= .992; p.vy *= .992; p.life--;
      ctx.globalAlpha = Math.min(1, p.life / 22) * Math.min(1, (p.max - p.life + 15) / 15);
      ctx.fillStyle = p.color; ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.sparkle ? (p.life % 7 < 3 ? 1.45 : .65) : 1), 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (opened || particles.length) raf = requestAnimationFrame(animate);
    else cancelAnimationFrame(raf);
  }
  function randomBurst() {
    burst(window.innerWidth * (.12 + Math.random()*.76), window.innerHeight * (.12 + Math.random()*.48), 65 + Math.floor(Math.random()*40));
    if (!raf) animate();
  }
  openGift.addEventListener('click', () => {
    if (opened) return;
    opened = true;
    scene.classList.remove('gift-mode');
    giftScreen.classList.add('hidden');
    birthdayScreen.style.display = 'block';
    burst(window.innerWidth/2, window.innerHeight*.42, 130);
    for (let i=0; i<5; i++) setTimeout(randomBurst, 250 + i*420);
    const interval = setInterval(() => { if (!opened) clearInterval(interval); else randomBurst(); }, 1350);
    // Keep the stars and fireworks animated while the page is open.
  });
  showMessage.addEventListener('click', () => {
    const willShow = messageCard.hidden;
    messageCard.hidden = !willShow;
    showMessage.innerHTML = willShow ? '✧ &nbsp; A Message Just For You &nbsp; ✧' : '✧ &nbsp; A Message For You &nbsp; ✧';
    if (willShow) {
      burst(window.innerWidth/2, Math.min(window.innerHeight*.72, 650), 50);
      if (window.matchMedia('(max-width: 600px)').matches) {
        setTimeout(() => messageCard.scrollIntoView({behavior:'smooth', block:'nearest'}), 100);
      }
    }
  });
})();
</script>
</body>
</html>
